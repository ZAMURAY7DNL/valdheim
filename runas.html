:root{
  --bg:#0b1220;
  --bg2:#111a2e;
  --card:#16213a;
  --tx:#e8ecf5;
  --mu:#9aa7c2;
  --gold:#e0b25a;
  --gold2:#f6dc9a;
  --ice:#5cc8e8;
  --bd:#25324f;
  --ok:#4cc38a;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
  color-scheme:dark;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f4ee;
    --bg2:#ece8dc;
    --card:#ffffff;
    --tx:#18223a;
    --mu:#55627f;
    --gold:#a8741a;
    --gold2:#d7a64a;
    --ice:#17728f;
    --bd:#d9d3c2;
    --ok:#1f8a5b;
    color-scheme:light;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:16px/1.6 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased
}

a{
  color:inherit;
  text-decoration:none
}

button{
  font:inherit
}

.wrap{
  max-width:1080px;
  margin:0 auto;
  padding:0 20px
}

.shell{
  min-height:100vh;
  background:var(--bg);
  padding-top:var(--safe-area-inset-top);
  overflow-x:clip
}

.cinzel{
  font-family:Cinzel,Georgia,serif
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ice);
  border:1px solid var(--bd);
  padding:5px 13px;
  border-radius:99px
}

.eyebrow i{
  font-style:normal;
  color:var(--gold)
}

.btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  overflow:hidden;
  padding:13px 24px;
  border-radius:10px;
  font-weight:600;
  font-size:15px;
  border:1px solid var(--gold);
  background:linear-gradient(135deg,#f3d27f,var(--gold) 55%,#b98a35);
  color:#1a1405;
  cursor:pointer;
  box-shadow:0 10px 26px -10px #e0b25aaa;
  transition:transform .25s,box-shadow .3s
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 36px -10px #e0b25acc
}

.btn:active{
  transform:translateY(0) scale(.97)
}

.btn.o{
  background:transparent;
  color:var(--gold);
  box-shadow:none
}

.btn.o:hover{
  background:color-mix(in srgb,var(--gold) 14%,transparent)
}

.btn:focus-visible, a:focus-visible, [role="tab"]:focus-visible, summary:focus-visible{
  outline:2px solid var(--ice);
  outline-offset:3px
}

.rip{
  position:absolute;
  border-radius:50%;
  background:#fff6;
  transform:scale(0);
  animation:rp .65s ease-out forwards;
  pointer-events:none
}

@keyframes rp{
  to{
    transform:scale(3.5);
    opacity:0
  }
}

/* progress */

.progress{
  position:fixed;
  left:0;
  right:0;
  top:0;
  height:3px;
  z-index:50;
  background:transparent
}

.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--ice),var(--gold));
  transform-origin:0 50%;
  box-shadow:0 0 12px var(--gold)
}

/* nav */

.topnav{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:40;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--gold) 14%,var(--bd))
}

.topnav .wrap{
  display:flex;
  align-items:center;
  gap:20px;
  height:62px
}

.logo{
  font-family:Cinzel,serif;
  font-weight:800;
  letter-spacing:3px;
  color:var(--gold);
  font-size:19px;
  flex:none
}

.navlinks{
  display:flex;
  gap:18px;
  list-style:none;
  margin:0;
  padding:0;
  flex:1;
  justify-content:flex-end;
  font-size:14px;
  color:var(--mu);
  overflow-x:auto;
  scrollbar-width:none;
  white-space:nowrap
}

.navlinks::-webkit-scrollbar{
  display:none
}

.navlinks a{
  position:relative;
  padding:4px 0;
  display:inline-flex;
  gap:4px;
  align-items:center
}

.navlinks a .nr{
  font-size:11px;
  color:var(--gold);
  opacity:0;
  transform:translateY(3px);
  transition:.25s
}

.navlinks a:hover, .navlinks a.act{
  color:var(--gold)
}

.navlinks a:hover .nr, .navlinks a.act .nr{
  opacity:1;
  transform:none
}

.nav-cta{
  padding:8px 14px;
  font-size:14px;
  flex:none
}

.nav-cta .nr{
  font-size:11px
}

/* hero */

.hero{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  display:grid;
  align-items:center;
  min-height:min(760px, calc(100svh - 62px));
  padding:58px 0 56px;
  text-align:center;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,color-mix(in srgb,#2a6fd6 28%,transparent),transparent 70%)
}

.hero canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none
}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(70px);
  opacity:.32;
  pointer-events:none
}

.o1{
  width:380px;
  height:380px;
  background:#2a6fd6;
  left:-120px;
  top:-80px
}

.o2{
  width:300px;
  height:300px;
  background:var(--gold);
  right:-80px;
  top:60px;
  opacity:.2
}

.ringwrap{
  position:relative;
  width:min(560px,100%);
  aspect-ratio:1;
  margin:0 auto;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%
}

.ring{
  position:absolute;
  inset:9%;
  width:82%;
  height:82%;
  color:var(--gold);
  opacity:.16;
  pointer-events:none;
  animation:spin 120s linear infinite
}

.ring.inner{
  inset:19%;
  width:62%;
  height:62%;
  opacity:.22;
  color:var(--ice);
  animation:spinRev 84s linear infinite
}

.ring text{
  font-size:29px;
  fill:currentColor
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

@keyframes spinRev{
  to{
    transform:rotate(-360deg)
  }
}

.hero-title{
  position:relative;
  font-family:Cinzel,serif;
  font-size:clamp(38px,11vw,88px);
  font-weight:800;
  letter-spacing:.08em;
  line-height:1;
  white-space:nowrap;
  margin:0
}

.ch{
  display:inline-block;
  color:transparent;
  background:linear-gradient(100deg,var(--gold),var(--gold2) 32%,#fff6dc 50%,var(--gold2) 68%,var(--gold));
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards,sweep 6s ease-in-out infinite alternate;
  animation-delay:calc(var(--i)*70ms + 150ms),calc(var(--i)*-.35s)
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(.7em) rotateX(-80deg);
    filter:blur(8px)
  }

  to{
    opacity:1;
    transform:none;
    filter:none
  }
}

@keyframes sweep{
  from{
    background-position:0% 0
  }

  to{
    background-position:100% 0
  }
}

.subtitle{
  font-family:Cinzel,serif;
  font-size:clamp(14px,2.6vw,22px);
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--ice);
  margin-top:12px;
  min-height:1.4em
}

.cursor{
  color:var(--gold);
  animation:blink 1s steps(1) infinite
}

@keyframes blink{
  50%{
    opacity:0
  }
}

.lead{
  max-width:640px;
  margin:16px auto 22px;
  color:var(--mu);
  font-size:clamp(16px,2vw,19px)
}

.tag{
  display:inline-block;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ice);
  border:1px solid color-mix(in srgb,var(--ice) 35%,var(--bd));
  background:color-mix(in srgb,var(--ice) 8%,transparent);
  padding:6px 14px;
  border-radius:99px
}

.cta{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-top:20px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:34px auto 0;
  max-width:820px
}

.stat{
  padding:16px 10px;
  border-radius:14px;
  background:color-mix(in srgb,var(--card) 72%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 16%,var(--bd))
}

.stat b{
  display:block;
  font-family:Cinzel,serif;
  font-size:28px;
  color:var(--gold);
  line-height:1.1
}

.stat span{
  font-size:13px;
  color:var(--mu)
}

.realm{
  max-width:820px;
  margin:22px auto 0;
  text-align:left;
  padding:16px 18px;
  border-radius:14px;
  border:1px solid color-mix(in srgb,var(--gold) 30%,var(--bd));
  background:color-mix(in srgb,var(--card) 78%,transparent);
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  align-items:center
}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ok);
  font-weight:700
}

.live i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 0 #4cc38a99;
  animation:pill 1.8s infinite
}

@keyframes pill{
  100%{
    box-shadow:0 0 0 10px #4cc38a00
  }
}

.spark{
  display:flex;
  gap:4px;
  align-items:flex-end;
  height:28px
}

.spark i{
  width:8px;
  background:linear-gradient(var(--ice),var(--gold));
  border-radius:3px 3px 0 0
}

/* sections */

section{
  padding:68px 0;
  position:relative
}

section.alt{
  background:var(--bg2)
}

.hd{
  position:relative;
  text-align:center;
  max-width:720px;
  margin:0 auto 38px
}

.hd .mark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-family:Cinzel,serif;
  font-size:180px;
  line-height:1;
  color:var(--gold);
  opacity:.06;
  pointer-events:none;
  transition:transform .8s,opacity .8s
}

.hd h2{
  font-family:Cinzel,serif;
  font-size:clamp(28px,4.4vw,42px);
  letter-spacing:.02em;
  margin:16px 0 0;
  position:relative
}

.hd p{
  color:var(--mu);
  margin:12px 0 0;
  font-size:16px
}

.divider{
  display:flex;
  align-items:center;
  gap:14px;
  max-width:1080px;
  margin:0 auto;
  padding:0 20px;
  color:var(--gold)
}

.divider:before,.divider:after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg,transparent,var(--gold));
}

.divider:after{
  background:linear-gradient(90deg,var(--gold),transparent)
}

.divider span{
  font-size:22px;
  text-shadow:0 0 18px var(--gold);
  animation:glow 2.6s ease-in-out infinite
}

@keyframes glow{
  50%{
    text-shadow:0 0 28px var(--gold2);
    transform:scale(1.15)
  }
}

/* reveal */

.rv{
  opacity:0;
  transform:translateY(28px) scale(.98);
  filter:blur(5px);
  transition:opacity .65s,transform .65s,filter .65s
}

.rv.in{
  opacity:1;
  transform:none;
  filter:none
}

/* cards */

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}

.card{
  border-radius:16px;
  background:color-mix(in srgb,var(--card) 72%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 16%,var(--bd));
  box-shadow:0 16px 36px -22px #000c;
  padding:20px;
  transition:transform .35s,border-color .35s
}

.card:hover{
  border-color:var(--gold)
}

.mini-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px
}

.mini{
  padding:14px;
  border:1px solid var(--bd);
  border-radius:12px
}

.mini b{
  display:block;
  font-size:15px
}

.mini p{
  color:var(--mu);
  font-size:14px;
  margin:4px 0 0
}

.ico{
  font-size:24px
}

ul.ck{
  list-style:none;
  margin:10px 0 0;
  padding:0
}

ul.ck li{
  position:relative;
  padding:5px 0 5px 26px;
  color:var(--mu);
  font-size:14.5px
}

ul.ck li::before{
  content:"✓";
  position:absolute;
  left:0;
  color:var(--ok);
  font-weight:700
}

ul.ck.nx li::before{
  content:"→";
  color:var(--ice)
}

.note{
  font-size:13px;
  color:var(--mu);
  text-align:center;
  margin:20px auto 0;
  max-width:640px
}

/* tabs */

.tabs{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:20px
}

.tab{
  border:1px solid var(--bd);
  background:transparent;
  color:var(--mu);
  padding:11px 18px;
  border-radius:99px;
  cursor:pointer;
  font-weight:600;
  display:inline-flex;
  gap:9px;
  align-items:center;
  transition:.25s
}

.tab .tr{
  color:var(--gold)
}

.tab[aria-selected="true"]{
  background:color-mix(in srgb,var(--gold) 16%,transparent);
  border-color:var(--gold);
  color:var(--tx);
  box-shadow:0 0 0 1px var(--gold)
}

.tab-panel{
  animation:tabIn .45s ease both
}

@keyframes tabIn{
  from{
    opacity:0;
    transform:translateY(14px)
  }

  to{
    opacity:1;
    transform:none
  }
}

.runeflash{
  animation:flash .7s ease
}

@keyframes flash{
  0%{
    text-shadow:0 0 0 transparent
  }

  30%{
    text-shadow:0 0 26px var(--gold);
    transform:scale(1.25)
  }

  100%{
    text-shadow:none
  }
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:18px 20px;
  border-radius:14px;
  border:1px solid color-mix(in srgb,var(--gold) 30%,var(--bd));
  background:color-mix(in srgb,var(--card) 72%,transparent);
  margin-bottom:18px
}

.summary small{
  display:block;
  color:var(--mu);
  font-size:11px;
  letter-spacing:.15em;
  text-transform:uppercase
}

.summary b{
  display:block;
  font-family:Cinzel,serif;
  font-size:clamp(24px,4vw,32px);
  color:var(--gold)
}

.ticks{
  display:flex;
  gap:3px;
  margin-top:10px
}

.ticks i{
  flex:1;
  height:6px;
  border-radius:99px;
  background:var(--bd)
}

.ticks i.on{
  background:var(--gold)
}

/* accordion */

.acc{
  border:1px solid var(--bd);
  border-radius:12px;
  margin-bottom:8px;
  overflow:hidden;
  background:color-mix(in srgb,var(--card) 68%,transparent)
}

.acc-head{
  width:100%;
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  gap:12px;
  align-items:center;
  text-align:left;
  background:transparent;
  border:0;
  color:var(--tx);
  padding:14px 16px;
  cursor:pointer
}

.acc-head::-webkit-details-marker{
  display:none
}

.acc-head{
  list-style:none
}

.acc-head .rune{
  color:var(--gold);
  transition:transform .4s
}

.acc[open] .acc-head .rune, .acc.open .acc-head .rune{
  transform:rotate(180deg)
}

.acc-head h3{
  margin:0;
  font-size:15.5px;
  font-family:Cinzel,serif
}

.acc-head .amt{
  color:var(--gold);
  font-weight:700;
  white-space:nowrap
}

.chev{
  transition:transform .35s;
  color:var(--gold)
}

.acc.open .chev{
  transform:rotate(180deg)
}

.acc-body{
  display:block
}

.acc-inner{
  overflow:hidden
}

.acc-inner p{
  color:var(--mu);
  font-size:14.5px;
  margin:0;
  padding:0 16px 6px 44px
}

.warn{
  margin:0 16px 14px 44px!important;
  padding:10px 12px!important;
  border:1px solid color-mix(in srgb,var(--gold) 40%,var(--bd));
  border-radius:10px;
  background:color-mix(in srgb,var(--gold) 8%,transparent);
  font-size:13.5px;
  color:var(--mu)!important
}

.warn b{
  color:var(--tx)
}

.bar{
  height:6px;
  border-radius:99px;
  background:var(--bg2);
  border:1px solid var(--bd);
  overflow:hidden;
  margin:0 16px 14px 44px
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--ice),var(--gold));
  width:0
}

.phase-copy{
  padding:0 4px 14px;
  color:var(--mu)
}

/* simulator */

.sim{
  border-radius:16px;
  border:1px solid color-mix(in srgb,var(--gold) 35%,var(--bd));
  padding:22px;
  background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--gold) 14%,transparent),transparent 65%),color-mix(in srgb,var(--card) 75%,transparent);
  margin-bottom:22px
}

.sim-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:22px;
  align-items:center
}

.sim input[type=range]{
  width:100%;
  accent-color:var(--gold);
  cursor:pointer
}

.sim-big{
  font-family:Cinzel,serif;
  font-size:clamp(38px,7vw,56px);
  color:var(--gold);
  line-height:1
}

.sim-bar{
  height:10px;
  background:var(--bg2);
  border:1px solid var(--bd);
  border-radius:99px;
  overflow:hidden;
  margin:12px 0
}

.sim-bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--ice),var(--gold));
  transition:width .3s
}

.sim-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px
}

.sim-meta div{
  border:1px solid var(--bd);
  border-radius:10px;
  padding:10px
}

.sim-meta small{
  color:var(--mu);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em
}

.sim-meta b{
  display:block;
  margin-top:3px
}

/* funds + founder */

.funds{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:18px;
  align-items:stretch
}

.donut-wrap{
  display:grid;
  place-items:center;
  position:relative
}

.donut{
  width:190px;
  height:190px;
  transform:rotate(-90deg)
}

.donut circle{
  fill:none;
  stroke-width:26;
  cursor:pointer;
  transition:opacity .25s,stroke-width .25s
}

.donut circle.dim{
  opacity:.28
}

.donut circle.active{
  stroke-width:30
}

.donut-center{
  position:absolute;
  text-align:center;
  max-width:120px;
  pointer-events:none
}

.donut-center b{
  display:block;
  font-family:Cinzel,serif;
  color:var(--gold)
}

.donut-center span{
  font-size:12px;
  color:var(--mu)
}

.fund-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  align-content:center
}

.fund-list button{
  text-align:left;
  background:transparent;
  border:1px solid var(--bd);
  border-radius:12px;
  padding:14px;
  color:var(--tx);
  cursor:pointer
}

.fund-list button.active{
  border-color:var(--gold);
  background:color-mix(in srgb,var(--gold) 10%,transparent)
}

.fund-list b{
  display:block
}

.fund-list span{
  color:var(--mu);
  font-size:13px
}

.track{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:8px 2px 14px;
  scrollbar-width:thin
}

.level{
  flex:1;
  min-width:112px;
  border:1px solid var(--bd);
  background:transparent;
  color:var(--tx);
  border-radius:12px;
  padding:13px 10px;
  cursor:pointer;
  text-align:center;
  transition:.25s
}

.level.active{
  border-color:var(--gold);
  background:color-mix(in srgb,var(--gold) 14%,transparent);
  box-shadow:0 0 0 1px var(--gold)
}

.level .lr{
  font-size:20px;
  color:var(--gold)
}

.level b{
  display:block;
  font-size:13px;
  margin-top:4px
}

.level span{
  font-size:11px;
  color:var(--mu);
  text-transform:uppercase;
  letter-spacing:.06em
}

.founder-panel{
  border:1px solid color-mix(in srgb,var(--gold) 30%,var(--bd));
  border-radius:14px;
  padding:18px 20px;
  background:color-mix(in srgb,var(--card) 72%,transparent);
  display:grid;
  grid-template-columns:auto 1fr;
  gap:16px;
  align-items:start;
  animation:tabIn .4s ease both
}

.founder-panel .big{
  font-size:38px;
  color:var(--gold);
  line-height:1
}

/* tiers */

.tiers{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  align-items:stretch
}

.tier{
  border-radius:14px;
  border:1px solid color-mix(in srgb,var(--gold) 16%,var(--bd));
  background:color-mix(in srgb,var(--card) 72%,transparent);
  padding:18px 16px;
  display:flex;
  flex-direction:column;
  cursor:pointer;
  text-align:left;
  color:var(--tx);
  transition:.25s;
  position:relative;
  width:100%
}

.tier:hover{
  border-color:var(--gold);
  transform:translateY(-3px)
}

.tier.sel{
  border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold),0 18px 36px -18px #e0b25a99
}

.tier .pr{
  font-family:Cinzel,serif;
  font-size:30px;
  color:var(--gold);
  margin:8px 0
}

.tier .pr small{
  font-family:Inter,sans-serif;
  font-size:13px;
  color:var(--mu)
}

.tier ul{
  flex:1
}

.badge{
  align-self:flex-start;
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  background:var(--gold);
  color:#1a1405;
  padding:3px 9px;
  border-radius:99px;
  font-weight:700;
  margin-bottom:8px
}

.tier .btn{
  width:100%;
  padding:10px;
  margin-top:12px
}

.chosen{
  margin-top:14px;
  padding:14px 16px;
  border:1px solid var(--gold);
  border-radius:12px;
  background:color-mix(in srgb,var(--gold) 10%,transparent);
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  position:relative;
  overflow:hidden
}

.rune-confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden
}

.rune-confetti i{
  position:absolute;
  top:-12px;
  color:var(--gold);
  animation:fall 1.6s ease-in forwards
}

@keyframes fall{
  to{
    transform:translateY(90px) rotate(180deg);
    opacity:0
  }
}

.promise{
  max-width:760px;
  margin:0 auto 18px;
  text-align:center;
  padding:20px;
  border-radius:14px;
  border:1px solid color-mix(in srgb,var(--gold) 45%,var(--bd));
  background:color-mix(in srgb,var(--gold) 9%,transparent)
}

.promise h3{
  font-family:Cinzel,serif;
  color:var(--gold);
  margin:0 0 8px
}

.donate-box{
  max-width:720px;
  margin:0 auto 18px;
  text-align:center;
  padding:24px;
  border-radius:14px;
  background:color-mix(in srgb,var(--card) 72%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 30%,var(--bd))
}

.donate-box h3{
  font-family:Cinzel,serif;
  font-size:24px;
  margin:10px 0
}

.donate-box p{
  color:var(--mu);
  max-width:520px;
  margin:0 auto 18px
}

.conds{
  max-width:760px;
  margin:16px auto 0;
  padding:14px 16px;
  border:1px solid var(--bd);
  border-radius:12px;
  color:var(--mu);
  font-size:14px
}

.conds b{
  color:var(--tx)
}

.final .cta-box{
  text-align:center;
  padding:48px 24px;
  border-radius:22px;
  border:1px solid color-mix(in srgb,var(--gold) 30%,var(--bd));
  background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--gold) 16%,transparent),transparent 65%),color-mix(in srgb,var(--card) 70%,transparent)
}

footer{
  padding:32px 0 calc(32px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--bd);
  text-align:center;
  color:var(--mu);
  font-size:14px
}

#up{
  position:fixed;
  right:16px;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:45;
  width:46px;
  height:46px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:20px;
  color:var(--gold);
  background:color-mix(in srgb,var(--card) 80%,transparent);
  border:1px solid var(--gold);
  cursor:pointer;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:.3s
}

#up.on{
  opacity:1;
  transform:none;
  pointer-events:auto
}

#toast{
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:60;
  max-width:calc(100vw - 32px);
  padding:12px 18px;
  border-radius:12px;
  background:var(--card);
  border:1px solid var(--gold);
  color:var(--tx);
  font-size:14px;
  box-shadow:0 18px 40px -16px #000d;
  transform:translate(-50%,160%);
  opacity:0;
  transition:.5s;
  pointer-events:none;
  text-align:center
}

#toast.on{
  transform:translate(-50%,0);
  opacity:1
}

@media (max-width:860px){
  .tiers{
    grid-template-columns:repeat(2,1fr)
  }

  .tiers .tier:last-child{
    grid-column:1/-1
  }

  .sim-grid{
    grid-template-columns:1fr
  }

  .funds{
    grid-template-columns:1fr
  }

  .nav-cta{
    display:none
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }
}

@media (max-width:560px){
  .grid2{
    grid-template-columns:1fr
  }

  .mini-grid{
    grid-template-columns:1fr
  }

  .tiers{
    grid-template-columns:1fr
  }

  .tiers .tier:last-child{
    grid-column:auto
  }

  .summary{
    grid-template-columns:1fr
  }

  .acc-head{
    grid-template-columns:auto 1fr auto
  }

  .acc-head .amt{
    grid-column:2
  }

  .realm{
    grid-template-columns:1fr
  }

  .founder-panel{
    grid-template-columns:1fr
  }

  .hero{
    min-height:auto
  }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important
  }

  html{
    scroll-behavior:auto
  }

  .rv{
    opacity:1;
    transform:none;
    filter:none
  }

  .ch{
    background:none;
    color:var(--gold)
  }
}
