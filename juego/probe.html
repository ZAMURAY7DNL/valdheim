<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROBE viewport</title>
<style>
  html,body{margin:0;background:#0a1428;color:#fff;font-family:monospace}
  #caja{padding:24px;font-size:34px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
  b{color:#7CFC98}
</style>
</head>
<body>
<div id="caja">midiendo…</div>
<script>
  var caja = document.getElementById('caja');
  var n = 0;
  function medir() {
    n++;
    var vv = window.visualViewport;
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var sv = vv ? Math.min(vv.width / 1920, vv.height / 1080) : -1;
    caja.innerHTML =
      'PROBE #' + n + '\n' +
      'inner: <b>' + window.innerWidth + ' x ' + window.innerHeight + '</b>\n' +
      'visual: <b>' + (vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) : 'NO') + '</b>\n' +
      'docElem: <b>' + document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight + '</b>\n' +
      'screen: <b>' + screen.width + ' x ' + screen.height + '</b>\n' +
      'DPR: <b>' + window.devicePixelRatio + '</b>\n' +
      'escala con inner: <b>' + s.toFixed(4) + '</b>\n' +
      'escala con visual: <b>' + (sv >= 0 ? sv.toFixed(4) : '—') + '</b>\n' +
      'UA: ' + navigator.userAgent;
  }
  window.addEventListener('resize', medir);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', medir);
    visualViewport.addEventListener('scroll', medir);
  }
  window.addEventListener('orientationchange', function(){ setTimeout(medir, 300); });
  medir();
  setTimeout(medir, 1000);
  setTimeout(medir, 3000);
</script>
</body>
</html>
