<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PRUEBA de suscripción — VALDHEIM (dinero ficticio)</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#0d1020;color:#eef;margin:0;padding:24px}
.caja{max-width:520px;margin:24px auto;background:#171b31;border:1px solid #c9973f;border-radius:14px;padding:22px}
.aviso{background:#5c4303;color:#ffe9a8;border-radius:10px;padding:10px 14px;font-weight:700;text-align:center}
#ok{display:none;background:#14532d;color:#d1fae5;border-radius:10px;padding:14px;margin-top:16px;word-break:break-all}
#mal{display:none;background:#5b1a1a;color:#ffd7d7;border-radius:10px;padding:14px;margin-top:16px;word-break:break-all}
h1{font-size:20px;margin:10px 0 4px}p{color:#b9c0d8}
</style></head><body>
<div class="caja">
<div class="aviso">⚠ PÁGINA DE PRUEBA — DINERO FICTICIO ⚠</div>
<h1>Suscripción de prueba: Warrior · $10/mes (ficticios)</h1>
<p>Al aprobar, PayPal debe aceptar la suscripción de la cuenta falsa. Si lo hace, el circuito queda probado.</p>
<div id="boton"></div>
<div id="ok"></div>
<div id="mal"></div>
</div>
<script src="https://www.paypal.com/sdk/js?client-id=Afv_peO0OiqSDx6AQ4rQVwMKNM60ibz7enCoNBb-IV9CMvyEJnGtvrdNsbfxb-DRoU2SX_U1xl7RVryV&vault=true&intent=subscription&currency=USD" data-sdk-integration-source="button-factory"></script>
<script>
function mostrarOk(id){
  var d=document.getElementById('ok'); d.style.display='block';
  d.innerHTML='✅ <b>SUSCRIPCIÓN APROBADA</b><br>ID de la suscripción: '+id+'<br>Haz una captura y mándasela a Franky.';
}
function mostrarMal(detalle){
  var d=document.getElementById('mal'); d.style.display='block';
  d.textContent='❌ PayPal rechazó la aprobación: '+detalle;
}
paypal.Buttons({
  style:{shape:'rect',color:'gold',layout:'vertical',label:'subscribe'},
  createSubscription:function(data, actions){
    return actions.subscription.create({plan_id:'P-92871296BC5194404NLYGVSA', custom_id:'prueba-sandbox@valdheim.local'});
  },
  onApprove:function(data){ mostrarOk(data.subscriptionID); },
  onError:function(err){ mostrarMal(String(err)); }
}).render('#boton');
</script>
</body></html>
